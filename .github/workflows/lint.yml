# PR에서 린트만 돌린다.
#
# 빌드는 여기 넣지 않는다. Vercel이 프리뷰 배포를 위해 어차피 프로덕션 빌드를
# 돌리고 그 결과를 `Vercel` 커밋 상태로 올리므로, Actions에서 또 빌드하면
# 같은 일을 두 번 하는 셈이다. 반면 Next 16의 `next build`는 ESLint를 돌리지
# 않아서 린트는 어디에도 걸리지 않는다 — 그 구멍만 여기서 메운다.
#
# 아래 잡 이름 `lint`는 main 브랜치 보호의 필수 상태 체크 이름으로 그대로
# 쓰인다. 이름을 바꾸면 보호 설정이 영영 오지 않는 체크를 기다리게 되므로,
# 바꿀 때는 저장소 설정도 함께 고쳐야 한다.

name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Vercel이 24.x로 빌드한다. 로컬(22)과 갈라져 있지만 린트에는
          # 영향이 없고, 실제 배포가 도는 쪽에 맞춘다.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
