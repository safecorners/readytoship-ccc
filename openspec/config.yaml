schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  프로젝트: readytoship-ccc

  기술 스택:
  - Next.js 16 (App Router), React 19, TypeScript 5
  - Tailwind CSS v4 (@tailwindcss/postcss)
  - React Compiler (babel-plugin-react-compiler) 활성화
  - 배포: Vercel

  중요 — Next.js 16은 학습 데이터와 API/규약이 다르다.
  코드 작성 전 `node_modules/next/dist/docs/`의 해당 가이드를 읽을 것.

  소스 구조:
  - src/app/ — App Router 엔트리 (layout.tsx, page.tsx, globals.css)

  디자인 시스템:
  - design.md 에 ElevenLabs 디자인 시스템 문서가 있다. UI 작업 시 반드시 참조.
  - 오프화이트 캔버스(#f5f5f5) + 웜 니어블랙 잉크(#0c0a09), 채도 높은 CTA 색상 없음
  - 디스플레이 서체는 weight 300 (절대 볼드 금지), 본문은 Inter 400
  - CTA는 잉크 pill 1개가 primary, 투명 아웃라인이 secondary
  - 파스텔 그라디언트 오브(mint/peach/lavender/sky/rose)가 유일한 색 요소
  - 섹션 리듬 96px, 카드는 rounded-xl

  컨벤션:
  - 모든 문서·커밋 메시지·PR은 한국어로 작성한다.
  - 사용자와의 대화도 한국어.

